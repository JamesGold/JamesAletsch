# GitHub Pages (Jekyll) settings.
# Keep the full-size originals and build tooling off the public website;
# only the metadata-stripped copies in assets/gallery/ are published.
# The design concepts stay in the repo for reference but aren't published.
exclude:
  - photos
  - scripts
  - concepts
  - screenshots
  - IGNORE
  - build
  - config.codekit3
  - README.md
  - GALLERY.md
