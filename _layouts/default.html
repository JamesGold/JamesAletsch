<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
<div class="wrap">
{{ content }}
  <footer><span>© {{ site.artist.name }}</span><span>{{ site.artist.tagline }}</span></footer>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
{%- if page.gallery %}
<script src="{{ '/assets/js/gallery.js' | relative_url }}"></script>
<script>
  loadGallery(document.getElementById('gallery')).then(function (photos) {
    var count = document.getElementById('pcount');
    if (count && photos.length) count.textContent = photos.length;
    // The hero photo opens in the same viewer as the Inputs grid
    var hero = document.querySelector('[data-photo]');
    if (hero) hero.addEventListener('click', function (e) {
      var i = photos.findIndex(function (p) { return p.id === hero.dataset.photo; });
      if (i < 0) return;
      e.preventDefault();
      openLightbox(photos, i, hero);
    });
  });
</script>
{%- endif %}
</body>
</html>
